<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; font-family: Inter, -apple-system, Segoe UI, sans-serif; }
  body { margin: 0; padding: 14px; font-size: 13px; color: #111; width: 100%; max-width: 36rem; }
  h2 { margin: 0; font-size: 15px; }
  .topbar { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; width: 100%; }
  .topbar h2 { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #minBtn { border: none; background: transparent; padding: 4px; border-radius: 8px; display: flex; flex: none; cursor: pointer; }
  #minBtn:hover { background: #eee; }
  #minBtn svg { display: block; }
  body.minimized { padding: 8px 14px; }
  body.minimized .topbar { margin: 0; }
  body.minimized #panelBody { display: none; }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  input { flex: 1 1 12rem; min-width: 0; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; }
  button { padding: 8px 12px; border-radius: 16px; border: 1px solid #ddd; background: #fff; cursor: pointer; flex: 0 1 auto; }
  button.primary { background: #111; color: #fff; border-color: #111; }
  button:disabled { opacity: .5; }
  .status { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 12px; flex-wrap: wrap; }
  .dot { width: 0.65em; height: 0.65em; border-radius: 50%; background: #c00; flex: none; }
  .dot.on { background: #0a0; }
  #log { width: 100%; height: 180px; overflow: auto; background: #0f0f0f; color: #c8f5c8; font-family: monospace; font-size: 11px; padding: 8px; border-radius: 8px; white-space: pre-wrap; }
  .hint { background: #f5f5f5; border-radius: 8px; padding: 8px; font-size: 12px; margin-top: 10px; width: 100%; overflow-wrap: anywhere; }
  code { background: #eee; padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  details { margin: 8px 0; font-size: 12px; width: 100%; }
  details input { width: 100%; margin-top: 6px; }
</style>
</head>
<body>
<div class="topbar">
  <h2>oc mcp bridge</h2>
  <button id="minBtn" title="Minimize panel"><span id="minIcon"></span></button>
</div>
<div id="panelBody">

<div class="row">
  <input id="link" readonly spellcheck="false" style="letter-spacing:0;font-size:11px" title="Give this link to any AI" />
  <button id="copyLinkBtn" class="primary">Copy link</button>
</div>
<details>

  <summary>Advanced</summary>
  <input id="server" value="ws://localhost:3055" spellcheck="false" style="font-size:12px" />
</details>
<div class="row">
  <button id="connBtn" class="primary">Connect</button>
  <button id="pingBtn">Ping canvas</button>
</div>
<div class="status"><div id="dot" class="dot"></div><span id="statusText">disconnected</span></div>
<div id="log"></div>
<div class="hint">
  Give this link to ANY AI + tell it what to change:<br/>
  <code id="hintLink">http://localhost:3055/file</code><br/>
  (bridge bat must be running; MCP tools also work in opencode)
</div>
</div>

<script>
var ws = null;
var reconnectTimer = null;
var heartbeatTimer = null;
var wantConnected = false;
var failCount = 0;

function heartbeat() {
  try {
    if (wantConnected && ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'ping', client: 'figma-plugin' }));
    }
  } catch (e) {}
}
function startHeartbeat() {
  stopHeartbeat();
  heartbeatTimer = setInterval(heartbeat, 20000);
}
function stopHeartbeat() {
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
}

function log(msg) {
  var el = document.getElementById('log');
  var t = new Date().toLocaleTimeString();
  el.textContent += '[' + t + '] ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
}
function setStatus(on, text) {
  document.getElementById('dot').className = 'dot' + (on ? ' on' : '');
  document.getElementById('statusText').textContent = text;
  document.getElementById('connBtn').textContent = on ? 'Disconnect' : 'Connect';
}
var ICON_MIN = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 8.5L7 4L11.5 8.5" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ICON_MAX = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 5.5L7 10L11.5 5.5" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function setMin(min) {
  try {
    document.body.className = min ? 'minimized' : '';
    document.getElementById('minIcon').innerHTML = min ? ICON_MAX : ICON_MIN;
    document.getElementById('minBtn').title = min ? 'Expand panel' : 'Minimize panel';
    parent.postMessage({ pluginMessage: { id: 'local-resize', command: 'resize', params: min ? { width: 340, height: 64 } : { width: 340, height: 520 } } }, '*');
  } catch (e) {}
}
document.getElementById('minIcon').innerHTML = ICON_MIN;
document.getElementById('minBtn').onclick = function() { setMin(document.body.className !== 'minimized'); };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
try { localStorage.removeItem('oc_channel'); } catch (e) {}
var savedSrv = lsGet('oc_server');
if (savedSrv) document.getElementById('server').value = savedSrv;
function updateLink() {
  var srv = document.getElementById('server').value.trim().replace(/^ws:\/\//, 'http://').replace(/\/$/, '');
  var link = srv + '/file';
  document.getElementById('link').value = link;
  document.getElementById('hintLink').textContent = link;
}
updateLink();
function fallbackCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    log(ok ? 'copied ' + text : 'copy failed, select manually');
  } catch (e) { log('copy failed, select manually'); }
}
document.getElementById('server').oninput = function() { lsSet('oc_server', document.getElementById('server').value.trim()); updateLink(); };
document.getElementById('copyLinkBtn').onclick = function() {
  var input = document.getElementById('link');
  input.focus();
  input.select();
  var v = input.value;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(v).then(function() { log('link copied'); }, function() { fallbackCopy(v); });
    } else {
      fallbackCopy(v);
    }
  } catch (e) { fallbackCopy(v); }
};

function register() {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'register', client: 'figma-plugin' }));
  log('registered');
}

function connect() {
  var url = document.getElementById('server').value.trim();
  if (!/^wss?:\/\//.test(url)) { log('invalid server URL (expected ws:// or wss://): ' + url); setStatus(false, 'disconnected'); return; }
  lsSet('oc_server', url);
  wantConnected = true;
  try { if (ws) ws.close(); } catch (e) {}
  log('connecting to ' + url + ' ...');
  setStatus(false, 'connecting...');
  try { ws = new WebSocket(url); } catch (e) { setStatus(false, 'disconnected'); log('WebSocket failed: ' + ((e && e.message) || e) + ' — check server URL, is bridge running?'); return; }
  ws.onopen = function() {
    failCount = 0;
    setStatus(true, 'connected');
    log('ws open');
    register();
    startHeartbeat();
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  };
  ws.onmessage = function(ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { log('bad ws msg'); return; }
    if (msg.type === 'ping' || msg.type === 'welcome') { log('bridge: ' + (msg.type)); return; }
    // bridge -> figma command: { id, command, params }
    if (msg.command) {
      log('← ' + msg.command + ' #' + msg.id);
      parent.postMessage({ pluginMessage: { id: msg.id, command: msg.command, params: msg.params || {} } }, '*');
    } else {
      log('ws: ' + ev.data.slice(0, 200));
    }
  };
  ws.onclose = function(ev) {
    setStatus(false, 'disconnected');
    stopHeartbeat();
    log('ws closed code=' + (ev && ev.code) + ' reason=' + ((ev && ev.reason) || 'none') + ' — bridge running? test ' + url.replace(/^ws:\/\//, 'http://').replace(/\/$/, '') + '/health');
    if (wantConnected) {
      // stay connected until the user presses Disconnect: retry forever, backoff capped at 30s
      failCount++;
      var delay = Math.min(30000, 1000 * Math.pow(2, Math.min(failCount - 1, 4)));
      if (failCount > 3) log('retrying in ' + (delay / 1000) + 's (attempt ' + failCount + ') — press Disconnect to stop');
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(function() { if (wantConnected) connect(); }, delay);
    }
  };
  ws.onerror = function(ev) { log('ws error to ' + url + ' (start bridge: node server.js in oc mcp/bridge, keep it open)'); };
}

document.getElementById('connBtn').onclick = function() {
  if (ws && ws.readyState === 1) {
    wantConnected = false;
    failCount = 0;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    try { ws.close(); } catch (e) {}
    setStatus(false, 'disconnected');
  } else {
    connect();
  }
};

document.getElementById('pingBtn').onclick = function() {
  parent.postMessage({ pluginMessage: { id: 'local-ping', command: 'ping', params: {} } }, '*');
};

// messages from code.ts
window.onmessage = function(event) {
  var msg = event.data && event.data.pluginMessage;
  if (!msg) return;
  // local UI test response
  if (msg.id && String(msg.id).indexOf('local-') === 0) {
    if (msg.id === 'local-resize') return;
    log(msg.ok ? 'canvas: ' + JSON.stringify(msg.result).slice(0, 300) : 'canvas error: ' + msg.error);
    return;
  }
  // unsolicited events from code.ts -> forward to bridge
  if (msg.type === 'event') {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'event', event: msg.event, data: msg.data }));
    return;
  }
  // command response -> forward to bridge over ws
  if (msg.id !== undefined) {
    log((msg.ok ? '→ ok #' : '→ err #') + msg.id);
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ id: msg.id, ok: msg.ok, result: msg.result, error: msg.error }));
    } else {
      log('no ws, dropped response #' + msg.id);
    }
  }
};

// Figma may suspend the panel iframe while backgrounded: reconnect when visible again
document.addEventListener('visibilitychange', function() {
  if (!document.hidden && wantConnected && (!ws || ws.readyState !== 1)) {
    log('panel visible again, reconnecting...');
    connect();
  }
});

// auto-connect on open so users just run the plugin (bridge must be running via start-bridge.bat)
setTimeout(function() {
  if (!ws || ws.readyState !== 1) {
    log('auto-connecting...');
    connect();
  }
}, 600);
</script>
</body>
</html>
